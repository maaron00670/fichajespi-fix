server {
    listen 80;
    sendfile on;
    default_type application/octet-stream;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
#proxy para que se pueda usar fichajes desde red no local
    location /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
    
        # Asegurar que el token Authorization se reenvía al upstream
        proxy_set_header Authorization $http_authorization;
    
        # Cabeceras mínimas que quieras mantener
        proxy_set_header Host $proxy_host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header Connection $http_connection;
    
        # (Opcional) si quieres que el backend vea la IP real
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
}
